name: Publish site

# main is published at the root; the splat branch (the 3D preview) at /splat/.
on:
  push:
    branches: [main, splat]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: splat
          path: splat
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the 3D preview (splat branch)
        if: hashFiles('splat/package.json') != ''
        working-directory: splat
        run: |
          npm ci
          npm run build
          mkdir -p ../main/dist/splat
          cp -r dist/. ../main/dist/splat/
      - name: Push the built site to gh-pages
        run: |
          cd main/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "cybercryptixcoder"
          git config user.email "official.shreyas28@gmail.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
